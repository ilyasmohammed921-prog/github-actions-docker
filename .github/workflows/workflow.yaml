```yaml
name: CI-CD Docker Deployment

on:
  push:
    branches:
      - main

jobs:

  # =========================
  # CI
  # =========================

  build-and-push:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest

    steps:

      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKER_PWD }}

      - name: Build Docker Image
        run: |
          docker build \
            -t ${{ secrets.DOCKERHUB_USERNAME }}/github-actions-docker:latest .

      - name: Push Docker Image
        run: |
          docker push \
            ${{ secrets.DOCKERHUB_USERNAME }}/github-actions-docker:latest


  # =========================
  # CD
  # =========================

  deploy-to-ec2:
    name: Deploy to EC2
    needs: build-and-push
    runs-on: ubuntu-latest

    steps:

      - name: SSH into EC2 and Deploy
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ec2-user
          key: ${{ secrets.EC2_SSH_KEY }}

          script: |

            echo "Starting deployment..."

            echo "Pulling latest Docker image..."

            sudo docker pull \
              ${{ secrets.DOCKERHUB_USERNAME }}/github-actions-docker:latest


            echo "Stopping old container..."

            sudo docker stop github-actions-docker || true


            echo "Removing old container..."

            sudo docker rm github-actions-docker || true


            echo "Starting new container..."

            sudo docker run -d \
              --name github-actions-docker \
              -p 80:80 \
              --restart unless-stopped \
              ${{ secrets.DOCKERHUB_USERNAME }}/github-actions-docker:latest


            echo "Cleaning unused images..."

            sudo docker image prune -f


            echo "Deployment successful!"

            echo "Running container:"

            sudo docker ps
```
